# .github/workflows/desktop.yml
# Builds the FRETLAB Windows desktop app (installer + portable exe).
# Run manually from the Actions tab, or push a tag like v1.0.1 to also publish a GitHub Release.

name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build installer + portable exe
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FRETLAB-windows
          path: |
            release/*.exe
            release/latest.yml

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FRETLAB-Setup-*.exe
            release/FRETLAB-*-portable.exe
